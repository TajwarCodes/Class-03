<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecobazar Header</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }

  /* ===== Top bar ===== */
  .top-bar {
    background: #262A25;
    color: #cfd2ce;
    font-size: 13px;
    padding: 10px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-bar-left svg { flex-shrink: 0; }
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .top-bar-right .divider {
    width: 1px;
    height: 16px;
    background: #4a4d47;
  }
  .dropdown {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: #cfd2ce;
  }
  .dropdown svg { width: 10px; height: 10px; }
  .auth-link {
    color: #cfd2ce;
    text-decoration: none;
    cursor: pointer;
  }

  /* ===== Main header ===== */
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 60px;
    background: #ffffff;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 26px;
    font-weight: 700;
    color: #1c1f1a;
  }
  .logo svg { flex-shrink: 0; }

  .search-bar {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 480px;
    margin: 0 40px;
    border: 1px solid #e2e2e2;
    border-radius: 4px;
    overflow: hidden;
  }
  .search-bar input {
    border: none;
    outline: none;
    flex: 1;
    padding: 14px 16px;
    font-size: 14px;
    color: #333;
  }
  .search-bar input::placeholder { color: #9a9a9a; }
  .search-icon {
    padding: 0 10px 0 16px;
    display: flex;
    align-items: center;
    color: #9a9a9a;
  }
  .search-btn {
    background: #5CB93E;
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 14px 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .search-btn:hover { background: #4fa833; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .wishlist-icon {
    color: #1c1f1a;
    display: flex;
  }
  .header-divider {
    width: 1px;
    height: 34px;
    background: #e2e2e2;
  }
  .cart {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-icon-wrap {
    position: relative;
    display: flex;
  }
  .cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #5CB93E;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-text { font-size: 13px; color: #6b6f68; }
  .cart-total { font-size: 15px; font-weight: 700; color: #1c1f1a; }

  @media (max-width: 900px) {
    .top-bar, .main-header { padding: 14px 20px; flex-wrap: wrap; gap: 12px; }
    .search-bar { margin: 12px 0; max-width: 100%; order: 3; width: 100%; }
  }
</style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Store Location: Lincoln– 344, Illinois, Chicago, USA</span>
    </div>
    <div class="top-bar-right">
      <div class="dropdown">
        <span>Eng</span>
        <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
      </div>
      <div class="dropdown">
        <span>USD</span>
        <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
      </div>
      <div class="divider"></div>
      <a class="auth-link" href="#">Sign in / Sign up</a>
    </div>
  </div>

  <!-- Main header -->
  <div class="main-header">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#5CB93E">
        <path d="M12 2c-4 3-6 7-6 11a6 6 0 0 0 12 0c0-4-2-8-6-11z"/>
        <path d="M12 22V10" stroke="#2e6b1f" stroke-width="1.5"/>
      </svg>
      Ecobazar
    </div>

    <div class="search-bar">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" placeholder="search">
      <button class="search-btn">Search</button>
    </div>

    <div class="header-actions">
      <span class="wishlist-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </span>
      <div class="header-divider"></div>
      <div class="cart">
        <span class="cart-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c1f1a" stroke-width="1.8">
            <path d="M6 8V6a6 6 0 1 1 12 0v2"/>
            <path d="M4 8h16l-1.2 12.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 8z"/>
          </svg>
          <span class="cart-badge">1</span>
        </span>
        <div>
          <div class="cart-text">Shopping cart:</div>
          <div class="cart-total">$57.00</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
